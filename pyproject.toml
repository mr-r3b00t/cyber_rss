[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyber-rss-dashboard"
version = "0.1.0"
description = "Tableau de bord de veille cyber basé sur les flux de cyber_rss"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11,<7",
  "flask>=3.1,<4",
  "requests>=2.32,<3",
]

[project.scripts]
cyber-rss = "cyber_rss.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cyber_rss"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
